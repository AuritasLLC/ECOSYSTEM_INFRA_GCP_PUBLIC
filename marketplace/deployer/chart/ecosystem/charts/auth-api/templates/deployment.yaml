{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecosystem.resourceName" (list . "api-auth") }}
  labels:
    app.kubernetes.io/name: api-auth
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: authentication-api
spec:
  replicas: {{ .Values.replicaCount | default 1 }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: api-auth
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-auth
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: authentication-api
        {{- with .Values.global.marketplace.consumptionLabel }}
        goog-partner-solution: {{ . | quote }}
        {{- end }}

    spec:
      {{- if .Values.global.cloudSql.enabled }}
      serviceAccountName: {{ required "global.cloudSql.serviceAccount.name is required" .Values.global.cloudSql.serviceAccount.name }}
      {{- end }}

      terminationGracePeriodSeconds: 30

      containers:
        - name: api-auth
          image: "{{ required "auth-api image.repository is required" .Values.image.repository }}:{{ required "auth-api image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}

          ports:
            - name: http
              containerPort: {{ .Values.port | default 3000 }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "ecosystem.resourceName" (list . "auth-api-config") }}

          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret | default "asmplus-runtime-secrets" }}
                  key: PGPASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret | default "asmplus-runtime-secrets" }}
                  key: JWT_SECRET

            - name: AUTH_SUPER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret | default "asmplus-runtime-secrets" }}
                  key: AUTH_SUPER_ADMIN_PASSWORD

            - name: AUTH_CLIENT_KEY_FRONT_ASM_PLUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret | default "asmplus-runtime-secrets" }}
                  key: AUTH_CLIENT_KEY

            - name: AUTH_CLIENT_KEY_FRONT_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret | default "asmplus-runtime-secrets" }}
                  key: AUTH_CLIENT_KEY_FRONT_AUTH
                  optional: true

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/db
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        {{- if .Values.global.cloudSql.enabled }}
        - name: cloud-sql-proxy
          image: "{{ .Values.global.cloudSql.proxy.repository }}:{{ .Values.global.cloudSql.proxy.tag }}"
          imagePullPolicy: IfNotPresent

          args:
            {{- if .Values.global.cloudSql.privateIp }}
            - "--private-ip"
            {{- end }}
            - "--structured-logs"
            - "--port={{ .Values.global.cloudSql.proxy.port }}"
            - {{ required "global.cloudSql.instanceConnectionName is required" .Values.global.cloudSql.instanceConnectionName | quote }}

          ports:
            - name: cloudsql
              containerPort: {{ .Values.global.cloudSql.proxy.port }}
              protocol: TCP

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false

          resources:
            {{- toYaml .Values.global.cloudSql.proxy.resources | nindent 12 }}
        {{- end }}
{{- end }}
