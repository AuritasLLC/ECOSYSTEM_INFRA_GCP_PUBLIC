{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecosystem.resourceName" (list . "front-auth") }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: {{ printf "{\"default\":\"%s\"}" (include "ecosystem.resourceName" (list . "front-auth-backend")) | quote }}
  labels:
    app.kubernetes.io/name: front-auth
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: authentication-frontend
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: front-auth
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.port | default 80 }}
      targetPort: http
{{- end }}
