{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ecosystem.resourceName" (list . "front-asm-plus-config") }}
  labels:
    app.kubernetes.io/name: front-asm-plus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: document-management-frontend
data:
{{- range $key, $value := omit (.Values.config | default dict) "PORT" "API_BASE_URL" "BASE_AUTH_API" "FILE_VIEWER_BASE_URL" "SSO_URL" "ROUTER_BASENAME" }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
  PORT: {{ .Values.port | default 8080 | quote }}
  ROUTER_BASENAME: "/"
  API_BASE_URL: {{ required "global.publicUrls.apiAsmPlus is required" .Values.global.publicUrls.apiAsmPlus | quote }}
  BASE_AUTH_API: {{ required "global.publicUrls.apiAuth is required" .Values.global.publicUrls.apiAuth | quote }}
  FILE_VIEWER_BASE_URL: {{ required "global.publicUrls.viewer is required" .Values.global.publicUrls.viewer | quote }}
  SSO_URL: {{ printf "%s/sso?redirect={redirect}" (trimSuffix "/" .Values.global.publicUrls.auth) | quote }}
{{- end }}
