{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecosystem.resourceName" (list . "postgresql") }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgresql
      protocol: TCP
      port: {{ .Values.port | default 5432 }}
      targetPort: postgresql
{{- end }}
