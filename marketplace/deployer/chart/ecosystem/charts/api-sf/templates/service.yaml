{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecosystem.resourceName" (list . "api-sf") }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: {{ printf "{\"default\":\"%s\"}" (include "ecosystem.resourceName" (list . "api-sf-backend")) | quote }}
  labels:
    app.kubernetes.io/name: api-sf
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: successfactors-api
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: api-sf
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.port | default 3030 }}
      targetPort: http
{{- end }}
