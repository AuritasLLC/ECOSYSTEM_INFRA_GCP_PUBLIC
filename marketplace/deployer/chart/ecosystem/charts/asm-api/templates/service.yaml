{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecosystem.resourceName" (list . "asm-api") }}
  labels:
    app.kubernetes.io/name: asm-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage-api
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: asm-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.port | default 3000 }}
      targetPort: http
{{- end }}
