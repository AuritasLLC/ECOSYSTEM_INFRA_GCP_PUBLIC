{{- $asmPlus := index .Values "asm-plus-api" }}
{{- if .Values.migrations.asmPlus.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ecosystem.resourceName" (list . (printf "asmplus-migration-%s" (.Release.Revision | toString))) }}
  labels:
    app.kubernetes.io/name: asmplus-migration
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: asmplus-migration
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database-migration
        {{- with .Values.global.marketplace.consumptionLabel }}
        goog-partner-solution: {{ . | quote }}
        {{- end }}

    spec:
      serviceAccountName: {{ required "global.cloudSql.serviceAccount.name is required" .Values.global.cloudSql.serviceAccount.name }}
      restartPolicy: Never

      initContainers:
        - name: cloud-sql-proxy
          restartPolicy: Always

          image: "{{ required "global.cloudSql.proxy.repository is required" .Values.global.cloudSql.proxy.repository }}:{{ required "global.cloudSql.proxy.tag is required" .Values.global.cloudSql.proxy.tag }}"
          imagePullPolicy: IfNotPresent

          args:
            {{- if .Values.global.cloudSql.privateIp }}
            - "--private-ip"
            {{- end }}
            - "--structured-logs"
            - "--port={{ .Values.global.cloudSql.proxy.port | default 5432 }}"
            - {{ required "global.cloudSql.instanceConnectionName is required" .Values.global.cloudSql.instanceConnectionName | quote }}

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false

          resources:
            {{- toYaml .Values.global.cloudSql.proxy.resources | nindent 12 }}

      containers:
        - name: asmplus-migration

          image: "{{ required "asm-plus-api image.repository is required" $asmPlus.image.repository }}:{{ required "asm-plus-api image.tag is required" $asmPlus.image.tag }}"
          imagePullPolicy: {{ $asmPlus.image.pullPolicy | default "IfNotPresent" }}

          workingDir: /app

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -eu

              echo "Waiting for Cloud SQL Auth Proxy"

              node - <<'NODE'
              const net = require("net");

              const host = process.env.PGHOST || "127.0.0.1";
              const port = Number(process.env.PGPORT || "5432");
              let attempts = 0;

              function check() {
                const socket = net.createConnection({ host, port });

                socket.on("connect", () => {
                  console.log("Cloud SQL Proxy is ready");
                  socket.end();
                  process.exit(0);
                });

                socket.on("error", () => {
                  socket.destroy();
                  attempts += 1;

                  if (attempts >= 60) {
                    console.error("Timed out waiting for Cloud SQL Proxy");
                    process.exit(1);
                  }

                  setTimeout(check, 2000);
                });
              }

              check();
              NODE

              echo "Ensuring ASM+ prerequisite schema"

              node --input-type=module - <<'NODE'
              import fs from "node:fs";
              import path from "node:path";
              import pg from "pg";

              const { Client } = pg;
              const client = new Client({
                host: process.env.PGHOST || "127.0.0.1",
                port: Number(process.env.PGPORT || "5432"),
                user: process.env.PGUSER,
                password: process.env.PGPASSWORD,
                database: process.env.PGDATABASE,
                ssl: process.env.PGSSLMODE === "require" ? { rejectUnauthorized: false } : false,
              });

              const migrationFiles = [
                "/migrations/001_auth_schema.sql",
                "/migrations/002_document_storage_schema.sql",
              ];

              await client.connect();

              try {
                for (const migrationFile of migrationFiles) {
                  const sql = fs.readFileSync(migrationFile, "utf8");
                  console.log(`Applying ${path.basename(migrationFile)}`);
                  await client.query(sql);
                }
              } finally {
                await client.end();
              }
              NODE

              echo "Running ASM+ migration"
              npm run db:migrate
              echo "ASM+ migration completed"

          env:
            - name: NODE_ENV
              value: production

            - name: PGHOST
              value: "127.0.0.1"

            - name: PGPORT
              value: {{ .Values.global.cloudSql.proxy.port | default 5432 | quote }}

            - name: PGUSER
              value: {{ required "global.database.user is required" .Values.global.database.user | quote }}

            - name: PGDATABASE
              value: {{ required "global.database.name is required" .Values.global.database.name | quote }}

            - name: PGSSLMODE
              value: disable

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret | default "asmplus-runtime-secrets" }}
                  key: PGPASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret | default "asmplus-runtime-secrets" }}
                  key: JWT_SECRET

            - name: ASM_MICROSERVICE_URL
              value: {{ printf "http://%s:3000" (include "ecosystem.resourceName" (list . "asm-api")) | quote }}

            - name: ASM_MICROSERVICE_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret | default "asmplus-runtime-secrets" }}
                  key: ASM_API_KEY

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi

          volumeMounts:
            - name: migration-sql
              mountPath: /migrations
              readOnly: true

      volumes:
        - name: migration-sql
          configMap:
            name: {{ include "ecosystem.resourceName" (list . (printf "asmplus-migration-sql-%s" (.Release.Revision | toString))) }}
{{- end }}
