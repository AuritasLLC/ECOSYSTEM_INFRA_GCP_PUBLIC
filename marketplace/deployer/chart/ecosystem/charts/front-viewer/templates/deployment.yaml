{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecosystem.resourceName" (list . "front-viewer") }}
  labels:
    app.kubernetes.io/name: front-viewer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: document-viewer
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: front-viewer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: front-viewer
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: document-viewer
        {{- with .Values.global.marketplace.consumptionLabel }}
        goog-partner-solution: {{ . | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: front-viewer
          image: "{{ required "front-viewer image.repository is required" .Values.image.repository }}:{{ required "front-viewer image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.port | default 8080 }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "ecosystem.resourceName" (list . "front-viewer-config") }}

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
